name: Bug report
description: Reporte um problema reproduzível no Bundled Notes MCP.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Configure ...
        2. Execute ...
        3. Veja ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs mascarados
      description: Remova tokens, senhas, e-mails, IDs sensíveis e conteúdo real antes de colar.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidade
      options:
        - label: Removi credenciais, tokens, notas, anexos e respostas Firebase reais.
          required: true
